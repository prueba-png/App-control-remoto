name: Deploy frontend to GitHub Pages

# Publica la interfaz estática (carpeta public/) en GitHub Pages.
# El servidor de señalización (server.js) NO se despliega aquí: Pages solo
# sirve archivos estáticos. Despliega server.js en Render/Railway/Fly y apunta
# public/config.js a su URL wss://.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
